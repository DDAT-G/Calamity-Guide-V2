<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>칼라미티 공략집 2.0</title><style>body{background:#101722;color:#eaf0fa;font:16px system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center}main{text-align:center;padding:24px}button{padding:10px 18px;border-radius:8px;cursor:pointer}</style></head><body><main><p id="status" role="status">공략집을 불러오는 중입니다…</p><button hidden id="retry" onclick="location.reload()">다시 시도</button><noscript>JavaScript를 활성화해 주세요.</noscript></main><script>(async()=>{try{const paths=Array.from({length:16},(_,i)=>'guide-data/part-'+String(i+1).padStart(2,'0')+'.txt');const parts=await Promise.all(paths.map(async p=>{const r=await fetch(p);if(!r.ok)throw Error(p+': '+r.status);return r.text()}));const html=parts.join(''),bytes=new TextEncoder().encode(html);if(bytes.length!==4081523)throw Error('Incomplete guide');if(globalThis.crypto?.subtle){const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),v=>v.toString(16).padStart(2,'0')).join('');if(digest!=='1338a70100b2d19f22ea6213d10d45c56b0b63abdeab3eba154f4348d7271182')throw Error('Guide integrity mismatch')}document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('status').textContent='공략집을 불러오지 못했습니다.';document.getElementById('retry').hidden=false}})();</script></body></html>
